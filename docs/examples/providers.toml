# Example model providers for harnessd (D-87). Copy the ones you use into ~/.harness/config.toml.
#
# - Nothing here is a secret: `key_env` names the variable in harnessd's environment that holds the
#   key. Export it in the shell that runs harnessd; never put a key in this file or in the repo.
# - Pick one with `[agents] provider = "<name>"` in config.toml, or `HARNESS_PROVIDER=<name>`.
# - The demos read this file: `npm run demo:0b -- --real --provider openrouter`. Check a key first with
#   `node scripts/provider-check.ts --provider openrouter` (about $0.02).
# - Prices are USD per million tokens, used for metric M8 and the session budget. Checked 2026-10-04
#   (F-73, F-75, F-76, F-77, F-111); they change, so re-check them.
# - An A/B run uses one provider and model for both arms, never a router that picks models (D-87).

# OpenRouter, pinned to DeepSeek V4.1-Flash served by DeepSeek itself: the default for development,
# smoke tests and real-model runs (D-104, F-111, F-112). `provider.only` keeps every request on one
# provider: 30 serve this model on OpenRouter, some quantized to fp8 or fp4 (F-111). OpenRouter only
# guarantees Claude Code on Anthropic models (F-112); if the first runs show tool or hook problems, use
# openrouter-haiku below. Pay-as-you-go credits. Key: https://openrouter.ai/settings/keys
[providers.openrouter]
base_url = "https://openrouter.ai/api"
auth = "bearer"
key_env = "OPENROUTER_API_KEY"
model = "deepseek/deepseek-v4.1-flash"
max_context_tokens = 1000000
auto_compact_window = 200000
max_output_tokens = 32000
extra_body = { provider = { only = ["deepseek"], allow_fallbacks = false } }

[providers.openrouter.prices."deepseek/deepseek-v4.1-flash"]  # DeepSeek's own rates on OpenRouter (F-111)
input = 0.30
output = 1.20
cache_read = 0.006
cache_write = 0.30

# OpenRouter, pinned to Anthropic's Haiku 4.5 served by Anthropic: the one combination OpenRouter
# guarantees for Claude Code (F-112), at about four times the price of the default above.
[providers.openrouter-haiku]
base_url = "https://openrouter.ai/api"
auth = "bearer"
key_env = "OPENROUTER_API_KEY"
model = "anthropic/claude-haiku-4.5"
max_context_tokens = 200000
max_output_tokens = 32000
extra_body = { provider = { only = ["anthropic"], allow_fallbacks = false } }

[providers.openrouter-haiku.prices."anthropic/claude-haiku-4.5"]
input = 1.00
output = 5.00
cache_read = 0.10
cache_write = 1.25

# DeepSeek V4.1-Flash on DeepSeek's own endpoint: the same model as the default, without OpenRouter (F-72,
# F-73). Optional since D-104. Prepaid: top up at https://platform.deepseek.com/top_up.
# Key: https://platform.deepseek.com/api_keys
# Caution: DeepSeek maps any unknown model name to deepseek-flash, silently.
[providers.deepseek]
base_url = "https://api.deepseek.com/anthropic"
auth = "x-api-key"
key_env = "DEEPSEEK_API_KEY"
model = "deepseek-flash"
max_context_tokens = 1000000
auto_compact_window = 200000
max_output_tokens = 32000

[providers.deepseek.prices."deepseek-flash"]  # peak rates; off-peak is half (F-73)
input = 0.30
output = 1.20
cache_read = 0.006
cache_write = 0.30

# OpenRouter, pinned to one free model with tool calls, for $0 plumbing checks only (F-74, F-75). The free
# tier allows 50 requests a day under $10 of credits, and Claude Code's background calls count too.
[providers.openrouter-free]
base_url = "https://openrouter.ai/api"
auth = "bearer"
key_env = "OPENROUTER_API_KEY"
model = "qwen/qwen3.8-27b:free"
max_context_tokens = 262144
max_output_tokens = 16000
extra_body = { provider = { allow_fallbacks = false } }

[providers.openrouter-free.prices."qwen/qwen3.8-27b:free"]
input = 0
output = 0

# Kimi K2.6 (Moonshot), if you want a third option (F-76). Needs about $10 of top-up for a usable
# rate limit. Key: https://platform.kimi.ai/console/api-keys
[providers.kimi]
base_url = "https://api.moonshot.ai/anthropic"
auth = "bearer"
key_env = "MOONSHOT_API_KEY"
model = "kimi-k2.6"
max_context_tokens = 262144
max_output_tokens = 32000

[providers.kimi.prices."kimi-k2.6"]
input = 0.95
output = 4.00
cache_read = 0.16

# Anthropic Haiku 4.5, the later comparison and baseline (F-77). No base_url: the vendor's own endpoint,
# which prices its own models. Key: https://console.anthropic.com/settings/keys
[providers.haiku]
key_env = "ANTHROPIC_API_KEY"
model = "claude-haiku-4-5"
