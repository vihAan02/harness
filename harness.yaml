# This repository as a Harness project (D-110): the pilot builds its UI through Harness tasks.
# harness.yaml is untrusted input (D-52): each command runs only after the human approves it, in the sandbox.
setup:
  command: npm ci --ignore-scripts --no-audit --no-fund
  manifests:
    - package.json
    - package-lock.json
    - packages/protocol/package.json
    - packages/server/package.json
    - packages/adapters/package.json
    - packages/daemon/package.json
    - packages/cli/package.json
    - packages/ui/package.json
test:
  command: npm run typecheck && node --test "packages/ui/test/**/*.test.ts" test/structure.test.ts
  # What decides what the test command checks: a change to any of these needs the human's approval again (D-52).
  manifests:
    - package.json
    - package-lock.json
    - tsconfig.json
    - packages/ui/tsconfig.web.json
    - packages/ui/tsconfig.test.json
    - test/structure.test.ts
  timeout_seconds: 600
